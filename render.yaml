services:
  - type: web
    name: sifwaku-heatwatch
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////tmp/sifwaku_heatwatch.db
      - key: LOG_LEVEL
        value: INFO
